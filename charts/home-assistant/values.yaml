# ──────────────────────────────────────────────
# Namespace — all resources are created here
# ──────────────────────────────────────────────
namespace: home-assistant

# ──────────────────────────────────────────────
# Home Assistant — core home automation platform
# Docs: https://www.home-assistant.io/
# ──────────────────────────────────────────────
homeAssistant:
  image:
    repository: homeassistant/home-assistant
    tag: "2026.5.4"

  resources:
    requests:
      memory: "256Mi"
    limits:
      memory: "512Mi"

  # Persistent storage for /config (contains database, integrations, etc.)
  pvc:
    size: 9Gi
    storageClass: ""   # Leave empty to use cluster default

  # Host networking — only needed for mDNS/multicast in bare-metal environments.
  # Matter hostNetwork mode sets this automatically; leave false otherwise.
  hostNetwork: false

  # Privileged mode — only needed for direct hardware access (e.g. USB devices).
  privileged: false

  # ── Host devices ──
  devices:
    # Zigbee USB dongle (e.g. ConBee II, Sonoff Zigbee 3.0)
    # Find your device path with: ls /dev/ttyUSB* /dev/ttyACM*
    zigbee:
      enabled: false
      path: /dev/ttyUSB1

    # D-Bus socket — required for Bluetooth (Bluez) to work
    dbus:
      enabled: true
      path: /run/dbus

  # ── Plugins ──
  # Custom components downloaded and installed into /config/custom_components/ at startup.
  # Idempotent: a sha256 marker file prevents re-downloading on pod restart.
  plugins: []
  # - name: my-component
  #   url: https://github.com/user/repo/archive/refs/tags/v1.0.0.zip
  #   sha256: "abc123..."
  #   stripComponents: true   # strip top-level GitHub-generated directory from zip

  # ── OIDC Auth Integration ──
  # Adds OpenID Connect / OAuth2 login support via hass-oidc-auth.
  # Repo: https://github.com/christiaangoossens/hass-oidc-auth
  # When enabled, the plugin is automatically installed and oidc_auth.yaml is written.
  oidc:
    enabled: false
    # OIDC provider discovery URL
    # e.g. https://auth.example.com/realms/myrealm/.well-known/openid-configuration
    discoveryUrl: ""

    # Plugin source — pin a specific tag URL and its sha256 for integrity verification
    plugin:
      url: https://github.com/christiaangoossens/hass-oidc-auth/archive/refs/heads/main.zip
      sha256: ""

    clientId:
      # Provide exactly one of: value, secretKeyRef, or configMapKeyRef.
      value: ""
      secretKeyRef: {}    # { name: my-secret, key: client-id }
      configMapKeyRef: {} # { name: my-configmap, key: client-id }
    clientSecret:
      # Provide exactly one of: value or secretKeyRef.
      value: ""
      secretKeyRef: {}    # { name: my-secret, key: client-secret }

    # Optional: override JWT signing algorithm (default: RS256)
    idTokenSigningAlg: ""

    # Optional: name of the scope that carries group membership (e.g. "groups")
    groupsScope: ""

    # Optional: extra scopes to request beyond openid/profile/email
    additionalScopes: []
    # additionalScopes:
    #   - roles
    #   - offline_access

    # Optional: map your provider's claim names to what hass-oidc-auth expects
    claims:
      displayName: ""   # claim for the user's display name  (e.g. "name")
      username: ""      # claim for the username             (e.g. "preferred_username")
      groups: ""        # claim that carries group membership (e.g. "groups")

    # Optional: map provider group names to HA roles.
    # If "user" is set, OIDC users NOT in either group are rejected.
    roles:
      admin: ""   # group whose members become HA administrators
      user: ""    # group whose members become regular HA users

    # Keep the built-in homeassistant auth provider alongside OIDC.
    # Useful during initial setup or as a break-glass fallback.
    # When false (default), auth_providers: [] disables local username/password login.
    keepLocalAuth: false

  # ── Sidecar: Bluetooth/Bluez ──
  # Provides BLE (Bluetooth Low Energy) support for sensors like
  # plant soil monitors, temperature beacons, etc.
  bluez:
    enabled: false
    image:
      repository: ghcr.io/mysticrenji/bluez-service
      tag: "v1.1.0"

  # ── Sidecar: Matter Server ──
  # Enables Matter/Thread smart home protocol support.
  # Docs: https://github.com/home-assistant-libs/python-matter-server
  matter:
    enabled: false
    image:
      repository: ghcr.io/home-assistant-libs/python-matter-server
      tag: stable
    port: 5580

    # Network mode for Matter — required when matter.enabled is true.
    # "hostNetwork": uses the host network stack directly (simple, bare-metal)
    # "multus":      attaches a secondary interface via Multus CNI (cloud/isolated pods)
    networkMode: ""

    # Multus-specific settings (required when networkMode is "multus")
    multus:
      networkName: ""       # NetworkAttachmentDefinition name to annotate pods with
      masterInterface: ""   # Host interface to attach to (e.g. eth0)
      cniType: macvlan      # CNI plugin type (e.g. macvlan, ipvlan)

    # Persistent storage for matter-server /data
    pvc:
      size: 1Gi
      storageClass: ""

  # ── configuration.yaml ──
  # Structured parameters injected as /config/configuration.yaml.
  # Docs: https://www.home-assistant.io/docs/configuration/
  config:
    defaultConfig: true
    # Enable bluetooth integration. Disable in environments without BT hardware
    # (e.g. Kubernetes) to avoid 10+ second startup delays and timeout warnings.
    # When false, an explicit `bluetooth:` entry is emitted in configuration.yaml
    # which tells HA to skip auto-discovery of bluetooth adapters.
    bluetooth: false
    homeassistant:
      name: ""
      latitude: 0
      longitude: 0
      elevation: 0
      unitSystem: metric
      timeZone: UTC
      country: ""
    http:
      useXForwardedFor: false
      trustedProxies: []
      corsAllowedOrigins: []
    frontend:
      themes: true
    tts:
      platform: google_translate
    logger:
      default: warning
      components: {}
    automation: true
    script: true
    scene: true
    extra: ""

# ──────────────────────────────────────────────
# Gateway API — external access to Home Assistant
# Requires a Gateway API controller (e.g. Envoy Gateway, Cilium)
# TLS is terminated at the Gateway level, not at the HTTPRoute.
# ──────────────────────────────────────────────
gateway:
  enabled: false
  gatewayNamespace: ""
  gatewayName: ""
  hostname: ""
  # CIDR ranges that HA will trust X-Forwarded-For headers from.
  # Must cover the IP range of your gateway controller pods.
  # Find the right CIDR: kubectl get nodes -o jsonpath='{.items[*].spec.podCIDR}'
  # Required when gateway.enabled is true.
  trustedProxies: []

# ──────────────────────────────────────────────
# Z-Wave JS — Z-Wave device management
# Provides a web UI (port 8091) and WebSocket API (port 3000)
# Docs: https://zwave-js.github.io/zwave-js-ui/
# ──────────────────────────────────────────────
zwavejs:
  enabled: true
  image:
    repository: zwavejs/zwavejs2mqtt
    tag: "11.19.0"

  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"

  pvc:
    size: 500Mi
    storageClass: ""

  service:
    type: NodePort       # Use NodePort for direct access, ClusterIP for internal only
    nodePort: 30091      # Only used when type is NodePort

  devices:
    # Z-Wave USB dongle (e.g. Aeotec Z-Stick, Zooz ZST10)
    # Find your device path with: ls /dev/ttyUSB* /dev/ttyACM*
    # Set to empty string "" to skip mounting (e.g. in CI environments)
    zwave:
      path: /dev/ttyACM0

# ──────────────────────────────────────────────
# Mosquitto — MQTT message broker
# Used for device-to-HA communication via MQTT protocol
# Docs: https://mosquitto.org/
# ──────────────────────────────────────────────
mosquitto:
  enabled: true
  image:
    repository: eclipse-mosquitto
    tag: latest

  resources:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "250m"

  service:
    type: ClusterIP      # ClusterIP is usually sufficient (HA connects internally)

  ports:
    mqtt: 1883           # Standard MQTT port
    websocket: 9001      # MQTT over WebSocket
