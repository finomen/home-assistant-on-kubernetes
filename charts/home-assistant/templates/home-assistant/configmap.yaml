---
kind: ConfigMap
apiVersion: v1
metadata:
  name: home-assistant-configmap
  namespace: {{ .Values.namespace }}
  labels:
    app: home-assistant
    {{- include "chart.labels" . | nindent 4 }}
data:
  known_devices.yaml: |
  automations.yaml: |
  {{- if .Values.homeAssistant.config.script }}
  scripts.yaml: |
  {{- end }}
  {{- if .Values.homeAssistant.config.scene }}
  scenes.yaml: |
  {{- end }}
  configuration.yaml: |-
    {{- include "home-assistant.configuration" . | nindent 4 }}
