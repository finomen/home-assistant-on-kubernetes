{{- include "home-assistant.validateValues" . -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: {{ .Values.namespace }}
  name: home-assistant
  labels:
    app: home-assistant
    {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: home-assistant
  template:
    metadata:
      labels:
        app: home-assistant
      {{- if and .Values.homeAssistant.matter.enabled (eq .Values.homeAssistant.matter.networkMode "multus") }}
      annotations:
        k8s.v1.cni.cncf.io/networks: {{ .Values.homeAssistant.matter.multus.networkName }}
      {{- end }}
    spec:
      {{- if or .Values.homeAssistant.plugins .Values.homeAssistant.oidc.enabled }}
      initContainers:
        - name: install-plugins
          image: alpine:3.20
          command:
            - /bin/sh
            - -c
            - |
              {{- if .Values.homeAssistant.oidc.enabled }}
              {{- if .Values.homeAssistant.oidc.plugin.sha256 }}
              if [ "$(cat /config/custom_components/hass_oidc_auth/.sha256 2>/dev/null)" = {{ .Values.homeAssistant.oidc.plugin.sha256 | quote }} ]; then
                echo "Plugin hass_oidc_auth already at {{ .Values.homeAssistant.oidc.plugin.sha256 }}, skipping"
              else
                apk add --no-cache wget unzip
                wget -O /tmp/hass_oidc_auth.zip {{ .Values.homeAssistant.oidc.plugin.url }}
                echo "{{ .Values.homeAssistant.oidc.plugin.sha256 }}  /tmp/hass_oidc_auth.zip" | sha256sum -c
                mkdir -p /config/custom_components
                unzip /tmp/hass_oidc_auth.zip -d /tmp/hass_oidc_auth/
                rm -rf /config/custom_components/hass_oidc_auth
                cp -r /tmp/hass_oidc_auth/$(ls /tmp/hass_oidc_auth/ | head -1)/ /config/custom_components/hass_oidc_auth/
                echo "{{ .Values.homeAssistant.oidc.plugin.sha256 }}" > /config/custom_components/hass_oidc_auth/.sha256
              fi
              {{- else }}
              if [ -d /config/custom_components/hass_oidc_auth ]; then
                echo "Plugin hass_oidc_auth already installed, skipping"
              else
                apk add --no-cache wget unzip
                wget -O /tmp/hass_oidc_auth.zip {{ .Values.homeAssistant.oidc.plugin.url }}
                mkdir -p /config/custom_components
                unzip /tmp/hass_oidc_auth.zip -d /tmp/hass_oidc_auth/
                rm -rf /config/custom_components/hass_oidc_auth
                cp -r /tmp/hass_oidc_auth/$(ls /tmp/hass_oidc_auth/ | head -1)/ /config/custom_components/hass_oidc_auth/
              fi
              {{- end }}
              {{- end }}
              {{- range .Values.homeAssistant.plugins }}
              if [ "$(cat /config/custom_components/{{ .name }}/.sha256 2>/dev/null)" = {{ .sha256 | quote }} ]; then
                echo "Plugin {{ .name }} already at {{ .sha256 }}, skipping"
              else
                apk add --no-cache wget unzip
                wget -O /tmp/{{ .name }}.zip {{ .url }}
                echo "{{ .sha256 }}  /tmp/{{ .name }}.zip" | sha256sum -c
                mkdir -p /config/custom_components
                unzip /tmp/{{ .name }}.zip -d /tmp/{{ .name }}/
                rm -rf /config/custom_components/{{ .name }}
                {{- if .stripComponents }}
                cp -r /tmp/{{ .name }}/$(ls /tmp/{{ .name }}/ | head -1)/ /config/custom_components/{{ .name }}/
                {{- else }}
                cp -r /tmp/{{ .name }}/ /config/custom_components/{{ .name }}/
                {{- end }}
                echo "{{ .sha256 }}" > /config/custom_components/{{ .name }}/.sha256
              fi
              {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
        {{- if .Values.homeAssistant.oidc.enabled }}
        - name: oidc-config
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              printf 'client_id: "%s"\n' "$OIDC_CLIENT_ID" > /config/oidc_auth.yaml
              printf 'client_secret: "%s"\n' "$OIDC_CLIENT_SECRET" >> /config/oidc_auth.yaml
              printf 'discovery_url: "{{ .Values.homeAssistant.oidc.discoveryUrl }}"\n' >> /config/oidc_auth.yaml
              {{- if .Values.homeAssistant.oidc.idTokenSigningAlg }}
              printf 'id_token_signing_alg: {{ .Values.homeAssistant.oidc.idTokenSigningAlg }}\n' >> /config/oidc_auth.yaml
              {{- end }}
              {{- if .Values.homeAssistant.oidc.groupsScope }}
              printf 'groups_scope: {{ .Values.homeAssistant.oidc.groupsScope }}\n' >> /config/oidc_auth.yaml
              {{- end }}
              {{- if .Values.homeAssistant.oidc.additionalScopes }}
              printf 'additional_scopes:\n' >> /config/oidc_auth.yaml
              {{- range .Values.homeAssistant.oidc.additionalScopes }}
              printf '  - {{ . }}\n' >> /config/oidc_auth.yaml
              {{- end }}
              {{- end }}
              {{- if or .Values.homeAssistant.oidc.claims.displayName .Values.homeAssistant.oidc.claims.username .Values.homeAssistant.oidc.claims.groups }}
              printf 'claims:\n' >> /config/oidc_auth.yaml
              {{- if .Values.homeAssistant.oidc.claims.displayName }}
              printf '  display_name: {{ .Values.homeAssistant.oidc.claims.displayName }}\n' >> /config/oidc_auth.yaml
              {{- end }}
              {{- if .Values.homeAssistant.oidc.claims.username }}
              printf '  username: {{ .Values.homeAssistant.oidc.claims.username }}\n' >> /config/oidc_auth.yaml
              {{- end }}
              {{- if .Values.homeAssistant.oidc.claims.groups }}
              printf '  groups: {{ .Values.homeAssistant.oidc.claims.groups }}\n' >> /config/oidc_auth.yaml
              {{- end }}
              {{- end }}
              {{- if or .Values.homeAssistant.oidc.roles.admin .Values.homeAssistant.oidc.roles.user }}
              printf 'roles:\n' >> /config/oidc_auth.yaml
              {{- if .Values.homeAssistant.oidc.roles.admin }}
              printf '  admin: {{ .Values.homeAssistant.oidc.roles.admin }}\n' >> /config/oidc_auth.yaml
              {{- end }}
              {{- if .Values.homeAssistant.oidc.roles.user }}
              printf '  user: {{ .Values.homeAssistant.oidc.roles.user }}\n' >> /config/oidc_auth.yaml
              {{- end }}
              {{- end }}
          env:
            - name: OIDC_CLIENT_ID
              {{- if .Values.homeAssistant.oidc.clientId.secretKeyRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.homeAssistant.oidc.clientId.secretKeyRef.name | quote }}
                  key: {{ .Values.homeAssistant.oidc.clientId.secretKeyRef.key | quote }}
              {{- else if .Values.homeAssistant.oidc.clientId.configMapKeyRef.name }}
              valueFrom:
                configMapKeyRef:
                  name: {{ .Values.homeAssistant.oidc.clientId.configMapKeyRef.name | quote }}
                  key: {{ .Values.homeAssistant.oidc.clientId.configMapKeyRef.key | quote }}
              {{- else }}
              value: {{ .Values.homeAssistant.oidc.clientId.value | quote }}
              {{- end }}
            - name: OIDC_CLIENT_SECRET
              {{- if .Values.homeAssistant.oidc.clientSecret.secretKeyRef.name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.homeAssistant.oidc.clientSecret.secretKeyRef.name | quote }}
                  key: {{ .Values.homeAssistant.oidc.clientSecret.secretKeyRef.key | quote }}
              {{- else }}
              value: {{ .Values.homeAssistant.oidc.clientSecret.value | quote }}
              {{- end }}
          volumeMounts:
            - name: config
              mountPath: /config
        {{- end }}
      {{- end }}
      containers:
      {{- if .Values.homeAssistant.bluez.enabled }}
      - name: bluez
        image: {{ .Values.homeAssistant.bluez.image.repository }}:{{ .Values.homeAssistant.bluez.image.tag }}
        securityContext:
          privileged: true
      {{- end }}
      {{- if .Values.homeAssistant.matter.enabled }}
      - name: matter-server
        image: {{ .Values.homeAssistant.matter.image.repository }}:{{ .Values.homeAssistant.matter.image.tag }}
        securityContext:
          capabilities:
            add:
              - SYS_ADMIN
        imagePullPolicy: Always
        args:
          - --storage-path=/data
          - --paa-root-cert-dir=/data/credentials
          - --bluetooth-adapter=0
          {{- if eq .Values.homeAssistant.matter.networkMode "multus" }}
          - --primary-interface=net1
          {{- else }}
          - --primary-interface={{ .Values.homeAssistant.matter.multus.masterInterface }}
          {{- end }}
        ports:
          - containerPort: {{ .Values.homeAssistant.matter.port }}
        volumeMounts:
          - name: matter-data
            mountPath: /data
      {{- end }}
      - name: home-assistant
        image: {{ .Values.homeAssistant.image.repository }}:{{ .Values.homeAssistant.image.tag }}
        resources:
          {{- toYaml .Values.homeAssistant.resources | nindent 10 }}
        ports:
          - containerPort: 8123
        volumeMounts:
          - mountPath: /config
            name: config
          - mountPath: /config/configuration.yaml
            subPath: configuration.yaml
            name: configmap-file
          - mountPath: /config/automations.yaml
            subPath: automations.yaml
            name: configmap-file
          {{- if .Values.homeAssistant.config.script }}
          - mountPath: /config/scripts.yaml
            subPath: scripts.yaml
            name: configmap-file
          {{- end }}
          {{- if .Values.homeAssistant.config.scene }}
          - mountPath: /config/scenes.yaml
            subPath: scenes.yaml
            name: configmap-file
          {{- end }}
          - mountPath: /media
            name: media-volume
          {{- if .Values.homeAssistant.devices.dbus.enabled }}
          - mountPath: /run/dbus
            name: d-bus
          {{- end }}
          {{- if .Values.homeAssistant.devices.zigbee.enabled }}
          - mountPath: {{ .Values.homeAssistant.devices.zigbee.path }}
            name: zigbee
          {{- end }}
        securityContext:
          privileged: {{ .Values.homeAssistant.privileged }}
          {{- if and .Values.homeAssistant.matter.enabled (eq .Values.homeAssistant.matter.networkMode "hostNetwork") }}
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
          {{- end }}
      hostNetwork: {{ or .Values.homeAssistant.hostNetwork (and .Values.homeAssistant.matter.enabled (eq .Values.homeAssistant.matter.networkMode "hostNetwork")) }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: home-assistant-pvc
        - name: media-volume
          hostPath:
            path: /tmp/media
        - name: configmap-file
          configMap:
            name: home-assistant-configmap
        {{- if .Values.homeAssistant.devices.dbus.enabled }}
        - name: d-bus
          hostPath:
            path: {{ .Values.homeAssistant.devices.dbus.path }}
        {{- end }}
        {{- if .Values.homeAssistant.devices.zigbee.enabled }}
        - name: zigbee
          hostPath:
            path: {{ .Values.homeAssistant.devices.zigbee.path }}
        {{- end }}
        {{- if .Values.homeAssistant.matter.enabled }}
        - name: matter-data
          persistentVolumeClaim:
            claimName: matter-data-pvc
        {{- end }}
