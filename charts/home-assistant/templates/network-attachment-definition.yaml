{{- if and .Values.homeAssistant.matter.enabled (eq .Values.homeAssistant.matter.networkMode "multus") }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ .Values.homeAssistant.matter.multus.networkName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": {{ .Values.homeAssistant.matter.multus.cniType | quote }},
      "master": {{ .Values.homeAssistant.matter.multus.masterInterface | quote }},
      "mode": "bridge",
      "ipam": {}
    }
{{- end }}
